name: Build kmod-mtd-rw for RAX3000M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev unzip wget curl zstd || true
          df -h

      - name: Download SDK
        run: |
          wget https://downloads.immortalwrt.org/releases/24.10.6/targets/mediatek/filogic/immortalwrt-sdk-24.10.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst -O sdk.tar.zst

      - name: Extract SDK
        run: |
          tar -I zstd -xf sdk.tar.zst
          echo "SDK_DIR=$(ls -d immortalwrt-sdk-*/)" >> $GITHUB_ENV

      - name: Prepare Build Environment
        run: |
          cd ${{ env.SDK_DIR }}

          # 创建最小化的 feeds.conf（只保留 base 源，避免依赖冲突）
          cat > feeds.conf << 'EOF'
          src-git base https://github.com/immortalwrt/immortalwrt.git^tags/v24.10.6
          EOF

          # 克隆 mtd-rw 源码到 package 目录
          git clone https://github.com/jclehner/mtd-rw.git package/mtd-rw

          # 清理缓存
          rm -rf tmp/

          # 只更新 base 源
          ./scripts/feeds update base 2>&1 | tee /tmp/feeds.log
          ./scripts/feeds install -a 2>&1 | tee -a /tmp/feeds.log

          # 生成配置
          make defconfig

          # 启用 mtd-rw 模块编译
          echo "CONFIG_PACKAGE_kmod-mtd-rw=m" >> .config
          make defconfig

      - name: Compile kmod-mtd-rw
        run: |
          cd ${{ env.SDK_DIR }}
          make package/mtd-rw/compile V=s

      - name: Debug - List Build Output
        if: always()
        run: |
          cd ${{ env.SDK_DIR }}
          echo "=== bin/packages 目录结构 ==="
          find bin/packages -name "*.ipk" 2>/dev/null || echo "未找到 .ipk 文件"
          echo "=== bin/targets 目录结构 ==="
          find bin/targets -name "*.ipk" 2>/dev/null || echo "未找到 .ipk 文件"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kmod-mtd-rw-ipk
          path: |
            ${{ env.SDK_DIR }}/bin/packages/*/base/kmod-mtd-rw_*.ipk
            ${{ env.SDK_DIR }}/bin/packages/aarch64_cortex-a53/base/kmod-mtd-rw_*.ipk
          if-no-files-found: error

      - name: Upload Debug Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            /tmp/feeds.log
            ${{ env.SDK_DIR }}/.config
