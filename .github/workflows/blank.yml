name: Build kmod-mtd-rw for RAX3000M

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: 'SDK 下载链接 (留空则使用默认 24.10.6 filogic)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 清理磁盘空间并安装依赖 (已修正 python3-distutils 问题)
      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev unzip wget
          df -h

      # 3. 下载 SDK
      - name: Download SDK
        run: |
          if [ -z "${{ github.event.inputs.sdk_url }}" ]; then
            wget https://downloads.immortalwrt.org/releases/24.10.6/targets/mediatek/filogic/immortalwrt-sdk-24.10.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.xz -O sdk.tar.xz
          else
            wget "${{ github.event.inputs.sdk_url }}" -O sdk.tar.xz
          fi

      # 4. 解压 SDK
      - name: Extract SDK
        run: |
          tar -xJf sdk.tar.xz
          echo "SDK_DIR=$(ls -d immortalwrt-sdk-*/)" >> $GITHUB_ENV
          echo "SDK Directory is: $(ls -d immortalwrt-sdk-*/)"

      # 5. 准备编译环境
      - name: Prepare Build Environment
        run: |
          cd ${{ env.SDK_DIR }}
          
          # 克隆 mtd-rw 源码
          git clone https://github.com/jclehner/mtd-rw.git package/mtd-rw
          
          # 生成默认配置
          make defconfig
          
          # 启用 mtd-rw 模块编译
          echo "CONFIG_PACKAGE_kmod-mtd-rw=m" >> .config
          
          # 再次确认配置
          make defconfig

      # 6. 编译模块
      - name: Compile kmod-mtd-rw
        run: |
          cd ${{ env.SDK_DIR }}
          make package/mtd-rw/compile V=s

      # 7. 查找并上传产物
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kmod-mtd-rw-ipk
          path: ${{ env.SDK_DIR }}/bin/packages/*/base/kmod-mtd-rw_*.ipk
          if-no-files-found: error
