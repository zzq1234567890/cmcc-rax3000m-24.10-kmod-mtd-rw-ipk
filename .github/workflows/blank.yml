name: Build kmod-mtd-rw

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache libncurses-dev libssl-dev python3-setuptools wget curl zstd

      - name: Download SDK
        run: |
          wget https://downloads.immortalwrt.org/releases/24.10.6/targets/mediatek/filogic/immortalwrt-sdk-24.10.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst -O sdk.tar.zst
          tar -I zstd -xf sdk.tar.zst
          echo "SDK_DIR=$(ls -d immortalwrt-sdk-*/)" >> $GITHUB_ENV

      - name: Prepare Package
        run: |
          cd ${{ env.SDK_DIR }}
          mkdir -p package/mtd-rw

          # 自动获取最新的 Commit ID
          LATEST_COMMIT=$(git ls-remote https://github.com/jclehner/mtd-rw.git HEAD | awk '{print $1}')
          echo "Using Commit: $LATEST_COMMIT"

          cat > package/mtd-rw/Makefile << 'EOF'
          include $(TOPDIR)/rules.mk
          include $(INCLUDE_DIR)/kernel.mk

          PKG_NAME:=mtd-rw
          PKG_RELEASE:=1

          PKG_SOURCE_PROTO:=git
          PKG_SOURCE_URL:=https://github.com/jclehner/mtd-rw.git
          PKG_SOURCE_VERSION:=__LATEST_COMMIT__
          PKG_MIRROR_HASH:=skip

          PKG_MAINTAINER:=Joseph C. Lehner <joseph.c.lehner@gmail.com>
          PKG_LICENSE:=GPL-2.0

          include $(INCLUDE_DIR)/package.mk

          define KernelPackage/mtd-rw
            SUBMENU:=Other modules
            TITLE:=Write-enabler for MTD partitions
            FILES:=$(PKG_BUILD_DIR)/mtd-rw.ko
            AUTOLOAD:=$(call AutoLoad,30,mtd-rw)
          endef

          define KernelPackage/mtd-rw/description
            A kernel module that temporarily makes all MTD partitions writeable.
          endef

          MAKE_OPTS:= \
            ARCH="$(LINUX_KARCH)" \
            CROSS_COMPILE="$(TARGET_CROSS)" \
            M="$(PKG_BUILD_DIR)"

          define Build/Compile
            $(MAKE) -C "$(LINUX_DIR)" \
              $(MAKE_OPTS) \
              CONFIG_MTD_RW=m \
              modules
          endef

          $(eval $(call KernelPackage,mtd-rw))
          EOF

          sed -i "s/__LATEST_COMMIT__/${LATEST_COMMIT}/" package/mtd-rw/Makefile

      - name: Compile
        run: |
          cd ${{ env.SDK_DIR }}
          make defconfig
          make package/mtd-rw/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-mtd-rw
          path: |
            ${{ env.SDK_DIR }}/bin/packages/**/*.ipk
