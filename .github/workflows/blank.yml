name: Build kmod-mtd-rw for RAX3000M

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: 'SDK 下载链接 (留空则使用默认 24.10.6 filogic)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          # 增加了 zstd 用于解压 .tar.zst 文件
          sudo -E apt-get -qq install build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev unzip wget curl zstd
          df -h

      - name: Download SDK
        run: |
          if [ -z "${{ github.event.inputs.sdk_url }}" ]; then
            # 使用新的 .tar.zst 链接
            wget https://downloads.immortalwrt.org/releases/24.10.6/targets/mediatek/filogic/immortalwrt-sdk-24.10.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst -O sdk.tar.zst
          else
            wget "${{ github.event.inputs.sdk_url }}" -O sdk.tar.zst
          fi

      - name: Extract SDK
        run: |
          # 使用 zstd 解压
          tar -I zstd -xf sdk.tar.zst
          echo "SDK_DIR=$(ls -d immortalwrt-sdk-*/)" >> $GITHUB_ENV
          echo "SDK Directory is: $(ls -d immortalwrt-sdk-*/)"

      - name: Prepare Build Environment
        run: |
          cd ${{ env.SDK_DIR }}
          git clone https://github.com/jclehner/mtd-rw.git package/mtd-rw
          make defconfig
          echo "CONFIG_PACKAGE_kmod-mtd-rw=m" >> .config
          make defconfig

      - name: Compile kmod-mtd-rw
        run: |
          cd ${{ env.SDK_DIR }}
          make package/mtd-rw/compile V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kmod-mtd-rw-ipk
          path: ${{ env.SDK_DIR }}/bin/packages/*/base/kmod-mtd-rw_*.ipk
          if-no-files-found: error
